[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmienay-errhint"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别错误信息的可操作建议上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jimmienay" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jimmienay.github.io"
Repository = "https://github.com/jimmienay/errhint"
Issues = "https://github.com/jimmienay/errhint/issues"

[project.scripts]
errhint = "errhint:main"

[tool.setuptools]
py-modules = ["errhint"]
